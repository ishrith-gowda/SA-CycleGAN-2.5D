# pre-commit hooks for neuroscope (ruff-consolidated)
# install: pre-commit install
# run all: pre-commit run --all-files

# pre-commit operates on source files only; output/data dirs are excluded
# (consistent with the ruff exclude in pyproject.toml). vendored upstream LaTeX template
# files (the official ICLR/arXiv style + bst) are excluded too: they are third-party and must
# stay byte-identical to upstream, so our hygiene hooks must not rewrite them.
exclude: |
  (?x)^(
    (figures|results|evaluation_results|experiments|experiments_from_gpu|baseline_training_progress|arxiv|huggingface|preprocessed|preprocessed_registered|data|checkpoints|runs|mlruns|journal_extension/(figures|results|experiments))/
    |journal_extension/generality/iclr_paper/(iclr2027_conference\.(sty|bst)|natbib\.sty|fancyhdr\.sty|math_commands\.tex|arxiv\.sty)$
  )

repos:
  # general file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^\.vscode/
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: debug-statements

  # ruff: lint + format (replaces black, isort, flake8, and pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # note: bandit security scanning runs in ci (the "security scan" job), not as a
  # pre-commit hook, to avoid hook-version sync issues with newer bandit tests.
